# Bases de données de DÉVELOPPEMENT (100 % local, gratuit).
# Mode d'emploi : doc/infra/bases-de-donnees.md
#
#   cp .env.example .env
#   docker compose up -d
#
# Les ports ne sont ouverts que sur 127.0.0.1 : rien n'est exposé au réseau.
# Les services applicatifs (et leurs conteneurs <service>-migrate) viendront s'ajouter ici.

name: triply-dev

services:
  # PostgreSQL : schémas identity et travel, un rôle par microservice.
  # Image avec pgvector déjà installé (doc/api/postgres/orm.md, section vecteur) ;
  # l'extension n'est pas activée tant qu'aucune migration ne la demande.
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: triply
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      PG_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD:?définir PG_IDENTITY_PASSWORD dans .env}
      PG_TRAVEL_PASSWORD: ${PG_TRAVEL_PASSWORD:?définir PG_TRAVEL_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/bootstrap.sql:/triply/bootstrap.sql:ro
      - ./infra/postgres/dev-init.sh:/docker-entrypoint-initdb.d/10-triply.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triply"]
      interval: 5s
      retries: 10

  # MongoDB : replica set à un nœud, comme en prod (doc/api/mongo/choix-odm-mongodb.md).
  # Même version majeure que le cluster gratuit Atlas (8.0).
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      retries: 20

  # Job unique : collections, validateurs et index de la base assistant.
  # Même script qu'en prod. Rejouable : docker compose run --rm mongo-init
  mongo-init:
    image: mongo:8.0
    command: ["mongosh", "mongodb://mongo:27017/?replicaSet=rs0", "--quiet", "--file", "/triply/init.js"]
    environment:
      MONGO_DB: assistant
    volumes:
      - ./infra/mongo/init.js:/triply/init.js:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  # redis-core : sessions/révocation JWT, files BullMQ, propositions, idempotence.
  # Aucune éviction, persistance AOF (doc/api/redis/orm.md).
  redis-core:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_CORE_PASSWORD:?définir REDIS_CORE_PASSWORD dans .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_CORE_PORT:-6379}:6379"
    volumes:
      - redis-core-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_CORE_PASSWORD}

  # redis-cache : fiches, classements, générations. Éviction LRU, aucune persistance :
  # tout peut être reconstruit depuis la source.
  redis-cache:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_CACHE_PASSWORD:?définir REDIS_CACHE_PASSWORD dans .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_CACHE_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD}

volumes:
  pg-data:
  mongo-data:
  redis-core-data:
